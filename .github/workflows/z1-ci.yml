name: Z1 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads repository contents. Do not use pull_request_target here:
# every pull-request job executes code supplied by the PR.
permissions:
  contents: read

concurrency:
  group: z1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test Z1 humanitarian multi-model gateway
        run: node --test tests/humanitarian_policy.test.mjs tests/model_policy_gateway.test.mjs tests/z1-ai-api.test.mjs
      - name: Test Z1 Speak browser policy
        run: npm run test:speak-ui
      - name: Test Z1 Speak backend
        run: npm run test:speak

  python-core:
    name: Python Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install "pytest>=8,<10"
      - name: Run Z1 Core tests
        run: npm run test:core
      - name: Run Trust Wallet adapter tests
        run: python -m pytest tests/test_trust_wallet_adapter.py -q
      - name: Run Gitta asset validation tests
        run: npm run test:asset
